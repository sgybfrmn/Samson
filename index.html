<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AEGIS 1.0</title>

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#070707;
  color:#f0f0f0;
  padding:14px;
}

.app{
  max-width:1000px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#c9a84c;
}

.badge{
  font-size:12px;
  padding:4px 8px;
  border-radius:999px;
  background:#c9a84c22;
  color:#c9a84c;
  border:1px solid #c9a84c55;
  margin-left:8px;
}

.clock{
  color:#c0c0c0;
  font-size:14px;
}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:18px;
  padding:14px;
  backdrop-filter:blur(10px);
}

.kpi-label{
  color:#999;
  font-size:13px;
}

.kpi-value{
  font-size:28px;
  margin-top:6px;
  font-weight:bold;
}

.kpi-delta{
  margin-top:6px;
  font-size:13px;
}

.green{color:#5cb85c;}
.red{color:#d9534f;}
.yellow{color:#f0ad4e;}

.section-title{
  margin-bottom:12px;
  color:#c9a84c;
  font-size:18px;
}

.row{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  margin-bottom:18px;
}

.bar-chart{
  display:flex;
  align-items:flex-end;
  gap:8px;
  height:220px;
  margin-top:20px;
}

.bar-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.bar{
  width:100%;
  border-radius:8px 8px 0 0;
}

.month{
  margin-top:6px;
  font-size:12px;
  color:#777;
}

.team-item,
.agenda-item,
.decision-item{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.status-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:12px;
}

.tab{
  padding:10px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.1);
  background:#111;
  cursor:pointer;
  white-space:nowrap;
}

.active-tab{
  background:#c9a84c;
  color:#000;
  font-weight:bold;
}

.chat{
  height:380px;
  overflow-y:auto;
  padding:12px;
  border-radius:18px;
  background:#0d0d0d;
  border:1px solid rgba(255,255,255,0.07);
  margin-bottom:12px;
}

.msg{
  margin-bottom:14px;
}

.user{
  color:#4a9eff;
}

.ai{
  color:#c9a84c;
}

.input-row{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:14px;
  border:none;
  outline:none;
  border-radius:14px;
  background:#111;
  color:#fff;
}

button{
  border:none;
  padding:14px 18px;
  border-radius:14px;
  background:linear-gradient(135deg,#c9a84c,#a07830);
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.quick-prompts{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:12px;
}

.quick-btn{
  background:#111;
  color:#c9a84c;
  border:1px solid #333;
}

.badge-high{
  background:#d9534f22;
  color:#d9534f;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}

.badge-med{
  background:#f0ad4e22;
  color:#f0ad4e;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}

</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const advisors = {
  TITAN: {
    role: "Chief Strategy Advisor",
    style: "Visionary strategy guidance."
  },
  ATLAS: {
    role: "Operations Advisor",
    style: "Execution and systems."
  },
  NOVA: {
    role: "Finance & Growth Advisor",
    style: "Financial intelligence."
  },
  RAVEN: {
    role: "Risk & Intelligence Advisor",
    style: "Threat and compliance analysis."
  },
  ONYX: {
    role: "Marketing & Communications Advisor",
    style: "Brand and growth strategy."
  }
};

const kpiData = [
  {label:"Revenue",value:"$4.82M",delta:"+12.4%",trend:"green",spark:[60,65,58,72,68,80,75,90,85,95,88,100]},
  {label:"Burn Rate",value:"$1.1M",delta:"-3.2%",trend:"green",spark:[80,78,75,77,72,70,68,65,62,60,58,55]},
  {label:"ARR",value:"$57.8M",delta:"+18.7%",trend:"green",spark:[40,44,50,53,58,61,67,72,78,83,90,100]},
  {label:"NPS",value:"72",delta:"+5pts",trend:"green",spark:[55,58,55,62,60,65,63,68,66,70,69,72]},
];

const teamUpdates = [
  {dept:"Engineering",status:"#5cb85c",msg:"Sprint 24 on track — 94% velocity"},
  {dept:"Sales",status:"#f0ad4e",msg:"Q2 pipeline at 78% of target"},
  {dept:"Marketing",status:"#5cb85c",msg:"CAC down 8% MoM"},
  {dept:"Finance",status:"#5cb85c",msg:"Month-end close complete"},
  {dept:"Legal",status:"#d9534f",msg:"EU compliance deadline in 6 days"},
];

const agenda = [
  {time:"09:00",title:"Board Prep"},
  {time:"10:30",title:"Series C Call"},
  {time:"13:00",title:"Product Roadmap"},
  {time:"15:00",title:"Press Interview"},
  {time:"16:30",title:"1:1 Review"},
];

const decisions = [
  {label:"Approve Q3 hiring plan",urgency:"high"},
  {label:"Sign AWS Enterprise contract",urgency:"med"},
  {label:"Confirm UK expansion timeline",urgency:"med"},
];

const revenueMonths = ["J","F","M","A","M","J","J","A","S","O","N","D"];
const revenueActual = [3.1,3.4,3.2,3.8,3.7,4.0,3.9,4.2,4.4,4.5,4.7,4.82];
const revenueTarget = [3.0,3.3,3.6,3.9,3.8,4.1,4.0,4.3,4.2,4.5,4.6,5.0];

function Sparkline({data}){
  const max = Math.max(...data);

  const points = data.map((d,i)=>{
    const x = i * 10;
    const y = 40 - (d/max)*35;
    return `${x},${y}`;
  }).join(" ");

  return (
    <svg width="120" height="40">
      <polyline
        fill="none"
        stroke="#c9a84c"
        strokeWidth="2"
        points={points}
      />
    </svg>
  )
}

function App(){

  const [time,setTime] = React.useState(new Date());

  const [advisor,setAdvisor] = React.useState("TITAN");

  const [messages,setMessages] = React.useState([
    {
      role:"ai",
      text:"AEGIS online. Executive systems operational."
    }
  ]);

  const [input,setInput] = React.useState("");

  React.useEffect(()=>{
    const interval = setInterval(()=>{
      setTime(new Date());
    },1000);

    return ()=>clearInterval(interval);
  },[]);

  function fakeAIResponse(prompt){

    const responses = {
      TITAN:"Focus on long-term positioning and eliminate distractions.",
      ATLAS:"Create repeatable systems and tighten execution loops.",
      NOVA:"Monitor burn rate while increasing high-margin revenue.",
      RAVEN:"Legal exposure rising. Prioritize compliance immediately.",
      ONYX:"Refine messaging and strengthen audience trust."
    };

    return responses[advisor];
  }

  function send(){

    if(!input.trim()) return;

    const userMsg = {
      role:"user",
      text:input
    };

    const aiMsg = {
      role:"ai",
      text:fakeAIResponse(input)
    };

    setMessages(prev=>[...prev,userMsg,aiMsg]);

    setInput("");
  }

  return (
    <div className="app">

      <div className="header">
        <div>
          <span className="logo">AEGIS</span>
          <span className="badge">v1.0</span>
        </div>

        <div className="clock">
          {time.toLocaleTimeString()}
        </div>
      </div>

      <div className="kpi-grid">
        {kpiData.map((kpi,index)=>(
          <div className="card" key={index}>
            <div className="kpi-label">{kpi.label}</div>
            <div className="kpi-value">{kpi.value}</div>
            <div className={`kpi-delta ${kpi.trend}`}>
              {kpi.delta}
            </div>
            <Sparkline data={kpi.spark}/>
          </div>
        ))}
      </div>

      <div className="row">

        <div className="card">
          <div className="section-title">Revenue Performance</div>

          <div className="bar-chart">

            {revenueActual.map((v,i)=>{

              const target = revenueTarget[i];

              const above = v >= target;

              return(
                <div className="bar-wrap" key={i}>
                  <div
                    className="bar"
                    style={{
                      height:`${v*35}px`,
                      background:above
                        ? "linear-gradient(180deg,#c9a84c,#a07830)"
                        : "#d9534f"
                    }}
                  />

                  <div className="month">
                    {revenueMonths[i]}
                  </div>
                </div>
              )
            })}

          </div>

        </div>

        <div className="card">
          <div className="section-title">Team Status</div>

          {teamUpdates.map((item,index)=>(
            <div className="team-item" key={index}>
              <span
                className="status-dot"
                style={{background:item.status}}
              />
              <strong>{item.dept}</strong>
              <div style={{marginTop:"6px",color:"#bbb"}}>
                {item.msg}
              </div>
            </div>
          ))}
        </div>

        <div className="card">
          <div className="section-title">Agenda</div>

          {agenda.map((item,index)=>(
            <div className="agenda-item" key={index}>
              <strong>{item.time}</strong>
              <div style={{marginTop:"4px"}}>
                {item.title}
              </div>
            </div>
          ))}
        </div>

        <div className="card">
          <div className="section-title">Decision Queue</div>

          {decisions.map((d,index)=>(
            <div className="decision-item" key={index}>
              <div>{d.label}</div>

              <div style={{marginTop:"8px"}}>

                {d.urgency === "high"
                  ? <span className="badge-high">URGENT</span>
                  : <span className="badge-med">REVIEW</span>
                }

              </div>
            </div>
          ))}
        </div>

        <div className="card">

          <div className="section-title">
            AI Advisors
          </div>

          <div className="tabs">

            {Object.keys(advisors).map(name=>(
              <div
                key={name}
                onClick={()=>setAdvisor(name)}
                className={`tab ${advisor===name ? "active-tab" : ""}`}
              >
                {name}
              </div>
            ))}

          </div>

          <div className="quick-prompts">
            <button
              className="quick-btn"
              onClick={()=>setInput("What should I prioritize this week?")}
            >
              Weekly Priorities
            </button>

            <button
              className="quick-btn"
              onClick={()=>setInput("What is the biggest business risk right now?")}
            >
              Risks
            </button>

            <button
              className="quick-btn"
              onClick={()=>setInput("How do we grow faster?")}
            >
              Growth
            </button>
          </div>

          <div className="chat">

            {messages.map((m,index)=>(
              <div key={index} className="msg">

                <div className={m.role === "user" ? "user" : "ai"}>
                  <strong>
                    {m.role === "user"
                      ? "YOU"
                      : advisor}
                  </strong>
                </div>

                <div style={{marginTop:"4px"}}>
                  {m.text}
                </div>

              </div>
            ))}

          </div>

          <div className="input-row">

            <input
              value={input}
              placeholder="Ask your advisor..."
              onChange={(e)=>setInput(e.target.value)}
            />

            <button onClick={send}>
              SEND
            </button>

          </div>

        </div>

      </div>

    </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
