<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SAMSON 1.0</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#070707;color:#f0f0f0;padding:14px;}
.app{max-width:1000px;margin:auto;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.logo{font-size:28px;font-weight:bold;color:#c9a84c;}
.logo-sub{font-size:9px;color:#555;letter-spacing:0.15em;text-transform:uppercase;margin-top:2px;}
.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#c9a84c22;color:#c9a84c;border:1px solid #c9a84c55;margin-left:8px;}
.clock{color:#c0c0c0;font-size:14px;text-align:right;}
.online{font-size:9px;color:#5cb85c;letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:14px;backdrop-filter:blur(10px);}
.kpi-label{color:#999;font-size:13px;}
.kpi-value{font-size:28px;margin-top:6px;font-weight:bold;}
.kpi-delta{margin-top:6px;font-size:13px;}
.green{color:#5cb85c;}
.red{color:#d9534f;}
.yellow{color:#f0ad4e;}
.section-title{margin-bottom:12px;color:#c9a84c;font-size:18px;}
.row{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:18px;}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:220px;margin-top:20px;}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;}
.bar{width:100%;border-radius:8px 8px 0 0;}
.month{margin-top:6px;font-size:12px;color:#777;}
.team-item,.agenda-item,.decision-item{padding:12px;border-bottom:1px solid rgba(255,255,255,0.05);}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px;}
.tab{padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.1);background:#111;cursor:pointer;white-space:nowrap;color:#888;font-size:13px;}
.active-tab{background:#c9a84c;color:#000;font-weight:bold;}
.chat{height:380px;overflow-y:auto;padding:12px;border-radius:18px;background:#0d0d0d;border:1px solid rgba(255,255,255,0.07);margin-bottom:12px;}
.msg{margin-bottom:14px;}
.msg-user{color:#4a9eff;font-weight:bold;font-size:12px;margin-bottom:3px;}
.msg-ai{color:#c9a84c;font-weight:bold;font-size:12px;margin-bottom:3px;}
.msg-text{color:#ccc;font-size:13px;line-height:1.6;}
.input-row{display:flex;gap:10px;}
input{flex:1;padding:14px;border:none;outline:none;border-radius:14px;background:#111;color:#fff;font-size:13px;}
input::placeholder{color:#444;}
button{border:none;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,#c9a84c,#a07830);color:#000;font-weight:bold;cursor:pointer;font-size:13px;}
button:disabled{background:#333;color:#666;cursor:not-allowed;}
.quick-prompts{display:flex;gap:8px;overflow:auto;margin-bottom:12px;}
.quick-btn{background:#111;color:#c9a84c;border:1px solid #333;padding:8px 12px;border-radius:999px;font-size:12px;cursor:pointer;white-space:nowrap;}
.badge-high{background:#d9534f22;color:#d9534f;padding:4px 8px;border-radius:999px;font-size:12px;}
.badge-med{background:#f0ad4e22;color:#f0ad4e;padding:4px 8px;border-radius:999px;font-size:12px;}
.advisor-info{padding:10px 12px;background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.1);border-radius:10px;margin-bottom:12px;font-size:12px;color:#888;}
.advisor-info span{color:#c9a84c;font-weight:bold;}
.thinking{display:flex;gap:5px;align-items:center;padding:8px 0;}
.dot{width:6px;height:6px;border-radius:50%;background:#c9a84c;animation:pulse 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}
@keyframes pulse{0%,100%{opacity:0.3;transform:scale(1);}50%{opacity:1;transform:scale(1.4);}}
.footer{text-align:center;margin-top:20px;font-size:10px;color:#222;letter-spacing:0.1em;text-transform:uppercase;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ============================================================
// SAMSON — Synthetic Adaptive Mind for Strategic Operational Navigation
// ============================================================
// STEP 1: Paste your Anthropic API key below (between the quotes)
// STEP 2: Save the file — that's it, SAMSON is live
// ============================================================

const API_KEY = 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

// ============================================================
// ADVISOR ROSTER
// ============================================================
const ADVISORS = {
  TITAN: {
    role: "Chief Strategy Advisor",
    system: "You are TITAN, Chief Strategy Advisor inside SAMSON — Synthetic Adaptive Mind for Strategic Operational Navigation. You think in decades not quarters. Visionary, sharp, direct. Help the CEO see around corners, position against competitors, and make high-stakes decisions with confidence. Business context: ARR $57.8M, revenue $4.82M/mo +12.4% vs plan, NPS 72, burn $1.1M/mo, ~200 staff. Max 120 words. No fluff."
  },
  ATLAS: {
    role: "Operations & Execution",
    system: "You are ATLAS, Operations Advisor inside SAMSON — Synthetic Adaptive Mind for Strategic Operational Navigation. You are the engine that keeps everything running. Practical, process-driven, execution-focused. Help the CEO build systems, manage teams, and get things done on time. Business context: ARR $57.8M, revenue $4.82M/mo, burn $1.1M/mo, ~200 staff. Max 120 words. No fluff."
  },
  NOVA: {
    role: "Finance & Growth",
    system: "You are NOVA, Finance & Growth Advisor inside SAMSON — Synthetic Adaptive Mind for Strategic Operational Navigation. Numbers are your language. Help the CEO understand their financial position, grow revenue, prepare for funding, and make smart money decisions. Business context: ARR $57.8M, revenue $4.82M/mo +12.4% vs plan, burn $1.1M/mo, NPS 72. Max 120 words. No fluff."
  },
  RAVEN: {
    role: "Risk & Intelligence",
    system: "You are RAVEN, Risk & Intelligence Advisor inside SAMSON — Synthetic Adaptive Mind for Strategic Operational Navigation. You see threats before they happen. Flag legal risks, compliance issues, competitive dangers, and anything that could hurt the business. Be direct and urgent when needed. Current alert: EU compliance deadline in 6 days. Max 120 words. No fluff."
  },
  ONYX: {
    role: "Marketing & Communications",
    system: "You are ONYX, Marketing & Communications Advisor inside SAMSON — Synthetic Adaptive Mind for Strategic Operational Navigation. Brand, voice, and customer growth are your domain. Help the CEO craft messaging, grow their audience, win customers, and tell their story powerfully. Business context: NPS 72, CAC down 8% MoM. Max 120 words. No fluff."
  }
};

// ============================================================
// DASHBOARD DATA
// ============================================================
const kpiData = [
  {label:"Revenue", value:"$4.82M", delta:"+12.4%", trend:"green", spark:[60,65,58,72,68,80,75,90,85,95,88,100]},
  {label:"Burn Rate", value:"$1.1M", delta:"-3.2%", trend:"green", spark:[80,78,75,77,72,70,68,65,62,60,58,55]},
  {label:"ARR", value:"$57.8M", delta:"+18.7%", trend:"green", spark:[40,44,50,53,58,61,67,72,78,83,90,100]},
  {label:"NPS", value:"72", delta:"+5pts", trend:"green", spark:[55,58,55,62,60,65,63,68,66,70,69,72]},
];

const teamUpdates = [
  {dept:"Engineering", status:"#5cb85c", msg:"Sprint 24 on track — 94% velocity"},
  {dept:"Sales", status:"#f0ad4e", msg:"Q2 pipeline at 78% of target"},
  {dept:"Marketing", status:"#5cb85c", msg:"CAC down 8% MoM"},
  {dept:"Finance", status:"#5cb85c", msg:"Month-end close complete"},
  {dept:"Legal", status:"#d9534f", msg:"EU compliance deadline in 6 days"},
];

const agenda = [
  {time:"09:00", title:"Board Prep", with:"CFO + GC"},
  {time:"10:30", title:"Series C Call", with:"Sequoia"},
  {time:"13:00", title:"Product Roadmap", with:"CPO + Eng Leads"},
  {time:"15:00", title:"Press Interview", with:"TechCrunch"},
  {time:"16:30", title:"1:1 Review", with:"COO"},
];

const decisions = [
  {label:"Approve Q3 hiring plan (+18 HC)", urgency:"high"},
  {label:"Sign AWS Enterprise contract", urgency:"med"},
  {label:"Confirm UK expansion timeline", urgency:"med"},
];

const revenueMonths = ["J","F","M","A","M","J","J","A","S","O","N","D"];
const revenueActual = [3.1,3.4,3.2,3.8,3.7,4.0,3.9,4.2,4.4,4.5,4.7,4.82];
const revenueTarget = [3.0,3.3,3.6,3.9,3.8,4.1,4.0,4.3,4.2,4.5,4.6,5.0];

// ============================================================
// COMPONENTS
// ============================================================
function Sparkline({data}){
  const max = Math.max(...data);
  const points = data.map((d,i)=>`${i*10},${40-(d/max)*35}`).join(" ");
  return(
    <svg width="120" height="40">
      <polyline fill="none" stroke="#c9a84c" strokeWidth="2" points={points}/>
    </svg>
  );
}

function App(){
  const [time, setTime] = React.useState(new Date());
  const [advisor, setAdvisor] = React.useState("TITAN");
  const [messages, setMessages] = React.useState({
    TITAN:[{role:"ai", text:"TITAN online. Strategy systems ready. What are we building today?"}],
    ATLAS:[{role:"ai", text:"ATLAS online. Operations grid active. What needs executing?"}],
    NOVA:[{role:"ai", text:"NOVA online. Financial intelligence ready. What are the numbers telling us?"}],
    RAVEN:[{role:"ai", text:"RAVEN online. Risk sensors active. EU compliance deadline in 6 days — top priority."}],
    ONYX:[{role:"ai", text:"ONYX online. Brand and growth systems ready. What's the message today?"}],
  });
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const chatRef = React.useRef(null);

  React.useEffect(()=>{
    const interval = setInterval(()=>setTime(new Date()), 1000);
    return ()=>clearInterval(interval);
  },[]);

  React.useEffect(()=>{
    if(chatRef.current){
      chatRef.current.scrollTop = chatRef.current.scrollHeight;
    }
  },[messages, advisor]);

  async function send(text){
    const msg = (text || input).trim();
    if(!msg || loading) return;
    setInput("");

    const userMsg = {role:"user", text:msg};
    const currentHistory = [...messages[advisor], userMsg];

    setMessages(prev=>({...prev, [advisor]: currentHistory}));
    setLoading(true);

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key": API_KEY,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body: JSON.stringify({
          model:"claude-haiku-4-5-20251001",
          max_tokens:300,
          system: ADVISORS[advisor].system,
          messages: currentHistory.map(m=>({
            role: m.role==="ai" ? "assistant" : "user",
            content: m.text
          }))
        })
      });

      const data = await response.json();
      const reply = data.content?.map(b=>b.text||"").join("") || "Unable to process. Please retry.";
      setMessages(prev=>({...prev, [advisor]:[...currentHistory, {role:"ai", text:reply}]}));
    } catch(err){
      setMessages(prev=>({...prev, [advisor]:[...currentHistory, {role:"ai", text:"Connection error. Please retry."}]}));
    }

    setLoading(false);
  }

  const quickPrompts = [
    "What should I prioritize this week?",
    "What is the biggest risk right now?",
    "How do we grow faster?",
    "Help me plan my business",
    "Draft an investor pitch"
  ];

  return(
    <div className="app">

      {/* Header */}
      <div className="header">
        <div>
          <div>
            <span className="logo">SAMSON</span>
            <span className="badge">v1.0</span>
          </div>
          <div className="logo-sub">Synthetic Adaptive Mind for Strategic Operational Navigation</div>
        </div>
        <div className="clock">
          {time.toLocaleTimeString()}
          <div className="online">● System Online</div>
        </div>
      </div>

      {/* KPIs */}
      <div className="kpi-grid">
        {kpiData.map((kpi,i)=>(
          <div className="card" key={i}>
            <div className="kpi-label">{kpi.label}</div>
            <div className="kpi-value">{kpi.value}</div>
            <div className={`kpi-delta ${kpi.trend}`}>{kpi.delta}</div>
            <Sparkline data={kpi.spark}/>
          </div>
        ))}
      </div>

      <div className="row">

        {/* Revenue Chart */}
        <div className="card">
          <div className="section-title">Revenue Performance</div>
          <div className="bar-chart">
            {revenueActual.map((v,i)=>{
              const above = v >= revenueTarget[i];
              return(
                <div className="bar-wrap" key={i}>
                  <div className="bar" style={{
                    height:`${v*35}px`,
                    background: above
                      ? "linear-gradient(180deg,#c9a84c,#a07830)"
                      : "#d9534f"
                  }}/>
                  <div className="month">{revenueMonths[i]}</div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Team Status */}
        <div className="card">
          <div className="section-title">Team Status</div>
          {teamUpdates.map((item,i)=>(
            <div className="team-item" key={i}>
              <span className="status-dot" style={{background:item.status}}/>
              <strong>{item.dept}</strong>
              <div style={{marginTop:"6px",color:"#bbb"}}>{item.msg}</div>
            </div>
          ))}
        </div>

        {/* Agenda */}
        <div className="card">
          <div className="section-title">Today's Agenda</div>
          {agenda.map((item,i)=>(
            <div className="agenda-item" key={i}>
              <strong>{item.time}</strong> — {item.title}
              <div style={{marginTop:"4px",color:"#777",fontSize:"12px"}}>{item.with}</div>
            </div>
          ))}
        </div>

        {/* Decision Queue */}
        <div className="card">
          <div className="section-title">Decision Queue</div>
          {decisions.map((d,i)=>(
            <div className="decision-item" key={i}>
              <div>{d.label}</div>
              <div style={{marginTop:"8px"}}>
                {d.urgency==="high"
                  ? <span className="badge-high">URGENT</span>
                  : <span className="badge-med">REVIEW</span>
                }
              </div>
            </div>
          ))}
        </div>

        {/* AI Advisors */}
        <div className="card">
          <div className="section-title">AI Advisors</div>

          {/* Advisor Tabs */}
          <div className="tabs">
            {Object.keys(ADVISORS).map(name=>(
              <div
                key={name}
                onClick={()=>setAdvisor(name)}
                className={`tab ${advisor===name ? "active-tab" : ""}`}
              >
                {name}
              </div>
            ))}
          </div>

          {/* Advisor Info */}
          <div className="advisor-info">
            <span>{advisor}</span> — {ADVISORS[advisor].role}
          </div>

          {/* Quick Prompts */}
          <div className="quick-prompts">
            {quickPrompts.map(p=>(
              <button key={p} className="quick-btn" onClick={()=>send(p)}>
                {p}
              </button>
            ))}
          </div>

          {/* Chat Window */}
          <div className="chat" ref={chatRef}>
            {messages[advisor].map((m,i)=>(
              <div className="msg" key={i}>
                <div className={m.role==="user" ? "msg-user" : "msg-ai"}>
                  {m.role==="user" ? "YOU" : advisor}
                </div>
                <div className="msg-text">{m.text}</div>
              </div>
            ))}
            {loading && (
              <div className="thinking">
                <div className="dot"/>
                <div className="dot"/>
                <div className="dot"/>
              </div>
            )}
          </div>

          {/* Input */}
          <div className="input-row">
            <input
              value={input}
              placeholder={`Ask ${advisor} anything...`}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter" && send()}
            />
            <button onClick={()=>send()} disabled={loading}>
              {loading ? "···" : "SEND"}
            </button>
          </div>
        </div>

      </div>

      <div className="footer">
        SAMSON v1.0 — Synthetic Adaptive Mind for Strategic Operational Navigation — Powered by Claude
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
